[package]
name = "fluxel-egui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rust/egui rewrite of Fluxel with SQLite-compatible storage"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.8"
log = "0.4"
open = "5.3"
regex = "1.12"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
system-fonts = "0.1.2"
uuid = { version = "1.18", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
